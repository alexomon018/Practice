name: ci

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny by default, grant per job.
permissions: {}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      push: false
