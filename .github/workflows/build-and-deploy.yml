name: build-and-deploy

# Only application code triggers a build. Changes under k8s/ are deployment
# state -- Argo picks those up directly, and rebuilding on them would make
# this workflow retrigger itself on its own commit.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 213851292053.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::213851292053:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/practice-backend:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/practice-frontend:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Install kustomize
        run: |
          curl -sS "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      # Staging only. Prod is promoted by a human editing its newTag in a PR,
      # which is the entire point of prod having no automated sync.
      - name: Pin staging to this SHA
        working-directory: k8s/overlays/staging
        run: |
          kustomize edit set image \
            practice-backend=${{ env.ECR_REGISTRY }}/practice-backend:${{ steps.sha.outputs.short }} \
            practice-frontend=${{ env.ECR_REGISTRY }}/practice-frontend:${{ steps.sha.outputs.short }}

      - name: Commit the bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- k8s/overlays/staging; then
            echo "staging already on this SHA, nothing to commit"
            exit 0
          fi
          git add k8s/overlays/staging/kustomization.yaml
          git commit -m "deploy(staging): ${{ steps.sha.outputs.short }} [skip ci]"
          # The build runs at the triggering SHA, so main may have moved on --
          # on a re-run, or on two pushes in quick succession. Rebase rather
          # than force: the bump is the only thing this job owns.
          git pull --rebase origin main
          git push
