apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: practice-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexomon018/Practice.git
    # staging IS main. Every commit that lands -- an image pin, a change under
    # k8s/base, a tweak to this overlay -- reaches staging on the next poll,
    # with no workflow involved. That is what staging is for.
    targetRevision: main
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: practice-staging
  syncPolicy:
    automated: { prune: true, selfHeal: true }
