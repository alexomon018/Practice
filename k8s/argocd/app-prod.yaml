apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: practice-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexomon018/Practice.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: practice-prod

  # The GitHub `production` environment approval is the gate now, so there is
  # no second manual click here. selfHeal is what makes `git revert` of a
  # promotion commit a working rollback.
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=false
