apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: practice-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexomon018/Practice.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: practice-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
