apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: practice-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexomon018/Practice.git
    # dev IS develop. deploy-dev.yml used to build on develop but land its pin
    # on main, so dev's deployed state lived on a branch dev did not track.
    # Pointing at develop removes that hop.
    targetRevision: develop
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: practice-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
