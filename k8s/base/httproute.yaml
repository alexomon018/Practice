
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: practice
  namespace: practice
spec:
  parentRefs:
    - name: practice
      sectionName: http

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 3000

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
