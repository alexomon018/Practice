# Two instances so failover is exercised before prod depends on it, and a
# real StorageClass because kind's local-path does not exist on EKS.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 2

  storage:
    size: 20Gi
    storageClass: gp3

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
