apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: practice-staging

resources:
- ../../base

# No images block -- the tag is inherited from base. This file describes only
# how staging differs from everywhere else.
replicas:
- count: 2
  name: backend
- count: 2
  name: frontend

patches:
- path: postgres-patch.yaml
- path: ingress-patch.yaml

labels:
- pairs:
    app.kubernetes.io/environment: staging
