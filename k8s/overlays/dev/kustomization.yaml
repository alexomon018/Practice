apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: practice-dev

resources:
  - ../../base

# No images block -- the tag is inherited from base. dev runs a different image
# from staging because its Application tracks the develop branch, not because
# this file says anything different. For a local inner loop use
# docker-compose.yml, not this overlay.

# One of each: dev exists to prove the develop branch integrates, and a second
# replica proves nothing here that the staging overlay does not prove better.
replicas:
  - name: backend
    count: 1
  - name: frontend
    count: 1

patches:
  - path: backend-config-patch.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/environment: dev
