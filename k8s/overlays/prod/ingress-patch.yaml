apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: practice
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - practice.example.com
      secretName: practice-tls
  rules:
    - host: practice.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
