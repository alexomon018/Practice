# Without these, a node drain during an EKS upgrade can take every backend
# pod at once -- replicas: 3 does not by itself mean 3 stay up.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: frontend
