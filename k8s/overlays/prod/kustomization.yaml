apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: practice-prod

resources:
- ../../base
- pdb.yaml

# Prod is promoted by tag, never by "latest" -- the tag here is the whole
# release decision. It is copied verbatim from the staging overlay by the
# promote-prod job, and that job only runs after a required reviewer approves
# it, so this value never moves without a human in the loop.
images:
- name: practice-backend
  newName: 213851292053.dkr.ecr.us-east-1.amazonaws.com/practice-backend
  newTag: d3d3b28
- name: practice-frontend
  newName: 213851292053.dkr.ecr.us-east-1.amazonaws.com/practice-frontend
  newTag: d3d3b28

replicas:
- count: 3
  name: backend
- count: 3
  name: frontend

patches:
- path: postgres-patch.yaml
- path: ingress-patch.yaml

labels:
- pairs:
    app.kubernetes.io/environment: prod
