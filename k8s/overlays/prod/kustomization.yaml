apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: practice-prod

resources:
  - ../../base
  - pdb.yaml

# No images block. Prod's release decision is not a tag in this file any more:
# it is where the `prod-release` branch points. See k8s/argocd/app-prod.yaml.
replicas:
  - name: backend
    count: 3
  - name: frontend
    count: 3

patches:
  - path: postgres-patch.yaml
  - path: ingress-patch.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/environment: prod
