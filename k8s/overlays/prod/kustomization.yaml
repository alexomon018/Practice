apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: practice-prod

resources:
  - ../../base
  - pdb.yaml

# Prod is promoted by tag, never by "latest" -- the tag here is the whole
# release decision, and it moves only via a reviewed commit.
images:
  - name: practice-backend
    newName: 461415799375.dkr.ecr.us-east-1.amazonaws.com/practice-backend
    newTag: 0.1.0
  - name: practice-frontend
    newName: 461415799375.dkr.ecr.us-east-1.amazonaws.com/practice-frontend
    newTag: 0.1.0

replicas:
  - name: backend
    count: 3
  - name: frontend
    count: 3

patches:
  - path: postgres-patch.yaml
  - path: ingress-patch.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/environment: prod
