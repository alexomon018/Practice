# ---------------------------------------------------------------------------
# The frontend container's OWN nginx: it only serves static files.
# It does no proxying -- that is the edge nginx's job (see /nginx/conf.d).
#
# This file replaces /etc/nginx/conf.d/default.conf inside the image.
# ---------------------------------------------------------------------------

server {
    # Port 80 INSIDE the container only. It is never published to the host;
    # the only thing that connects here is the edge nginx, over the Docker
    # network. "Internal port" and "host port" are independent concepts.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Logs -> stdout/stderr, so `docker logs` sees them.
    # The official nginx image already symlinks these to /dev/stdout and
    # /dev/stderr; stating it explicitly documents the intent and survives
    # someone swapping the base image.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # config.js is rewritten at container startup from env vars. If a browser
    # cached it, an environment change would not take effect -- so never cache.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # Vite fingerprints bundles (app.4f2b1c.js). Because the name changes when
    # the content changes, these can be cached forever with zero risk.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html must NOT be cached, otherwise browsers keep pointing at the
    # old fingerprinted bundles after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # A liveness endpoint that costs nothing -- used by the compose healthcheck.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback: unknown paths return index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
