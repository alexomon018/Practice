log_format json_combined escape=json
  '{'
    '"ts":"$time_iso8601",'
    '"service":"nginx-edge",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
  '}';


error_log /dev/stderr warn;

server {
    listen 80;
    server_name _;
    
    access_log /dev/stdout json_combined;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server_tokens off;

    client_max_body_size 2m;

    # Health endpoint for this proxy itself.
    location = /healthz {
        access_log off;
        return 200 "edge ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        # THE IMPORTANT TRICK:
        # `proxy_pass http://backend:3000;` with a literal name is resolved
        # ONCE at startup and cached forever. Recreate the backend, it gets a
        # new IP, and nginx proxies to a corpse -> permanent 502.
        #
        # Putting the upstream in a VARIABLE forces nginx to use the resolver
        # on every request instead. The cost is that variable-form proxy_pass
        # does no automatic URI rewriting, so we append $request_uri ourselves
        # (it carries the full original path + query string, /api included --
        # which is exactly what the backend expects, since its router is
        # mounted at /api).
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream$request_uri;

        # --- Headers the backend needs to see the real client ---------------      
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";  

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_next_upstream error timeout;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

   
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

 

    error_page 502 503 504 /_upstream_down.json;
    location = /_upstream_down.json {
        internal;
        default_type application/json;
        return 503 '{"error":"upstream unavailable","hint":"docker compose ps / docker compose logs"}';
    }
}
